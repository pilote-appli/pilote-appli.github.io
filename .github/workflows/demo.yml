name: Demo de Pilote

# La demo de l'accueil (dossier demo/) est la vraie interface de Pilote sur les
# donnees de Brice. Elle doit suivre l'app : toutes les deux heures, ce workflow
# regarde la derniere release de Pilote ; si demo/version.txt est en retard, il
# refait la demo avec build/demo/fabriquer_demo.py de cette version, puis la
# commite ici. Le depot de Pilote est public : aucune cle a donner, ce depot-ci
# ne s'ecrit qu'avec son propre jeton. Detail : docs/demo-en-ligne.md de Pilote.
#
# Si la fabrication echoue (Yahoo qui ne repond pas, par exemple), rien n'est
# commite : l'ancienne demo reste en ligne, et l'essai suivant recommence.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:      # bouton « Run workflow » de l'onglet Actions : refait la demo tout de suite
  push:                   # et quand ce fichier change, pour l'essayer aussitot
    branches: [main]
    paths: ['.github/workflows/demo.yml']

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      refaire: ${{ steps.v.outputs.refaire }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Derniere version de Pilote
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/pilote-appli/pilote/releases/latest --jq .tag_name)
          version="${tag#v}"
          actuelle=$(cat demo/version.txt 2>/dev/null | tr -d '[:space:]' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$actuelle" ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "refaire=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Demo::$actuelle -> $version, a refaire"
          else
            echo "refaire=false" >> "$GITHUB_OUTPUT"
          fi

  fabriquer:
    needs: verifier
    if: needs.verifier.outputs.refaire == 'true'
    runs-on: windows-latest      # Edge y est installe : le script s'en sert pour parcourir l'app
    permissions:
      contents: write
    steps:
      - name: Checkout du site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: site

      - name: Checkout de Pilote ${{ needs.verifier.outputs.version }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: pilote-appli/pilote
          ref: v${{ needs.verifier.outputs.version }}
          path: pilote
          persist-credentials: false

      # Le script de la demo, lui, vient de main : ses corrections servent aussi
      # aux versions publiees avant elles (la 4.4.80 n'avait pas encore build/demo/)
      - name: Checkout du script (main de Pilote)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: pilote-appli/pilote
          path: outil
          persist-credentials: false
          sparse-checkout: build/demo

      - name: Script de main dans la version publiee
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pilote/build/demo | Out-Null
          Copy-Item outil/build/demo/* pilote/build/demo/ -Force

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pilote/requirements.txt playwright==1.48.0

      - name: Fabriquer la demo
        run: python pilote/build/demo/fabriquer_demo.py site/demo

      - name: Commiter
        shell: pwsh
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898075+github-actions[bot]@users.noreply.github.com"
          git add demo
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "Rien de change"; exit 0 }
          git commit -m "Demo : Pilote ${{ needs.verifier.outputs.version }} (donnees de Brice)"
          git push
